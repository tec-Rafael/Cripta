<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawn com pá — Idle</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#245355;color:#fff2d0;font:18px Georgia,serif}main{text-align:center;padding:20px}canvas{width:min(400px,85vw);height:auto;image-rendering:pixelated;background:#245355}button{font:inherit;background:#397f88;color:#fff2d0;border:2px solid #b3b58b;padding:10px 20px;cursor:pointer}a{color:#f5d68b}</style><main><h1>Pawn com pá</h1><canvas width="640" height="640" aria-label="Animação de repouso do Pawn segurando a pá"></canvas><p><button type="button">Pausar</button></p><p><a href="Pawn_Idle_Shovel-animated.gif">Abrir GIF animado</a></p><p role="status">Carregando…</p></main><script>const image=new Image(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('button');let playing=true;ctx.imageSmoothingEnabled=false;image.onload=()=>{document.querySelector('[role=status]').textContent='Repouso · 4 quadros';requestAnimationFrame(tick)};image.onerror=()=>document.querySelector('[role=status]').textContent='Não foi possível carregar os quadros.';image.src='Pawn_Idle_Shovel-sheet.png';let frame=0,last=0;function tick(time){if(playing&&time-last>=220){frame=(frame+1)%4;last=time}ctx.clearRect(0,0,640,640);ctx.drawImage(image,(frame%2)*640,Math.floor(frame/2)*640,640,640,0,0,640,640);requestAnimationFrame(tick)}button.onclick=()=>{playing=!playing;button.textContent=playing?'Pausar':'Continuar'};</script></html>
