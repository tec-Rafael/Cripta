<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../../"><title>Pawn — caminhada e ferramentas</title>
<style>*{box-sizing:border-box}body{margin:0;background:#49a7a7;color:#fff2d0;font:18px Georgia,serif}#world{display:block;width:100vw;height:100svh;image-rendering:pixelated}.controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));max-height:calc(100svh - 32px);overflow-y:auto;left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;text-align:center;padding:12px 20px;background:#193e40e8;border-radius:12px;box-shadow:0 4px 16px #153b3d40}h1{font-size:clamp(18px,4vw,26px);margin:0 0 8px}button{font:inherit;cursor:pointer;color:inherit;background:#397f88;border:2px solid #b3b58b;border-radius:4px;padding:7px 18px}p{margin:6px 0;font-size:15px}#status:empty{display:none}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:660px;margin:10px 0}nav button{font-size:15px;padding:7px 10px}button[aria-pressed="true"]{background:#856342;border-color:#f5d68b}button:focus-visible{outline:3px solid #fff2d0;outline-offset:3px}</style>
