<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pawn com pá — prévia</title>
<style>body{margin:0;padding:24px;background:#245355;color:#fff2d0;font:18px Georgia,serif;text-align:center}main{max-width:800px;margin:auto}.views{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}figure{margin:0;padding:16px;background:#193e40;border-radius:12px}canvas{width:280px;max-width:75vw;height:auto;image-rendering:pixelated}button,input{margin:12px}button{font:inherit;padding:8px 18px;color:#fff2d0;background:#397f88;border:2px solid #b3b58b}a{color:#f5d68b}p{line-height:1.5}</style>
<main><h1>Pawn interagindo com a pá</h1><p>Quadros originais do pacote, com a ferramenta adaptada.</p>
<div class="views"><figure><canvas id="right" width="224" height="192"></canvas><figcaption>Direita</figcaption></figure><figure><canvas id="left" width="224" height="192"></canvas><figcaption>Esquerda</figcaption></figure></div>
<label>Animação <select id="action"><option value="Interact">Usando a pá</option><option value="Idle">Parado</option><option value="Walk">Andando</option><option value="Run">Correndo</option></select></label><button id="pause" type="button">Pausar</button><label>Velocidade <input id="fps" type="range" min="2" max="15" value="5"><output id="speed">5 quadros/s</output></label>
<p id="status" role="status">Carregando sprites…</p><p><a href="Pawn_Interact%20Shovel.png">Abrir folha de sprites</a></p></main>
<script>
const image=new Image(),right=document.querySelector('#right'),left=document.querySelector('#left');let frame=0,clock=0,previous=0,playing=true;
function draw(){if(!image.complete||!image.naturalWidth)return;for(const [canvas,flip] of [[right,false],[left,true]]){const ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,224,192);ctx.imageSmoothingEnabled=false;if(flip){ctx.translate(224,0);ctx.scale(-1,1);}ctx.drawImage(image,frame*192+56,48,112,96,0,0,224,192);}}
image.onload=()=>{document.querySelector('#status').textContent=(image.width/192)+' quadros originais de 192 × 192 pixels';draw();if(!previous)requestAnimationFrame(tick);};image.onerror=()=>document.querySelector('#status').textContent='Não foi possível carregar a folha de sprites.';image.src='Pawn_Interact Shovel.png';
document.querySelector('#action').onchange=e=>{frame=0;clock=0;const action=e.target.value;const fps=action==='Idle'?10:action==='Walk'?8:action==='Run'?15:5;document.querySelector('#fps').value=fps;document.querySelector('#speed').textContent=fps+' quadros/s';image.src='Pawn_'+(action==='Walk'?'Run':action)+' Shovel.png';document.querySelector('a').href=image.src;};
function tick(time){const dt=previous?Math.min(100,time-previous):0;previous=time;if(playing&&image.complete&&image.naturalWidth){clock+=dt;const step=1000/Number(document.querySelector('#fps').value);while(clock>=step){frame=(frame+1)%(image.width/192);clock-=step;}draw();}requestAnimationFrame(tick);}
document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pausar':'Continuar';};document.querySelector('#fps').oninput=e=>document.querySelector('#speed').textContent=e.target.value+' quadros/s';
</script></html>
