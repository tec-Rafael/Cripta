<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprites separados · Barcos e montarias</title><style>*{box-sizing:border-box}body{margin:0;background:#22494e;color:#fff3d0;font:17px Georgia}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:28px}header{position:sticky;top:0;background:#22494ef5;padding:12px;z-index:1}button,input{font:inherit}button{padding:8px 16px;background:#458c94;color:#fff3d0;border:2px solid #a9c4b5;border-radius:4px}label{margin-left:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}article{padding:16px;border:1px solid #699a94;background:#367578;text-align:center;border-radius:8px}article:first-child{border:2px solid #dfca7b}canvas{max-width:100%;height:auto;image-rendering:pixelated;background:conic-gradient(#397e80 25%,#438a8b 0 50%,#397e80 0 75%,#438a8b 0) 0 0/24px 24px}a{color:#fff3d0}h2{font-size:19px}footer{font-size:14px;margin-top:20px}</style><main><header><h1>Barcos e montarias · sprites separados</h1><button id="play">Pausar</button><label>Quadro <input id="frame" type="range" min="0" max="23" value="0"><output id="number">1 / 24</output></label></header><div class="grid" id="grid"></div><footer>Pixels originais do GIF, transparência reconstruída. 24 quadros por sprite · 100 ms por quadro. O cavalo-marinho com cada animal foi mantido como uma única montaria.</footer></main><script>
const sprites=[['boat-empty','Barco vazio',158,128],['boat-shark-rowing','Tubarão remando',170,140],['seahorse-empty','Cavalo-marinho de madeira',94,102],['seahorse-shark-rider','Cavalo-marinho com tubarão',108,116],['seahorse-teal-rider','Cavalo-marinho com animal verde',119,94],['seahorse-yellow-rider','Cavalo-marinho com animal amarelo',99,108]];
const actors=[];let paused=false,frame=0,last=0;
for(const [name,label,w,h] of sprites){const card=document.createElement('article');card.innerHTML=`<h2>${label}</h2><canvas width="${w*2}" height="${h*2}" aria-label="${label}"></canvas><p><a href="separated/${name}.png">Spritesheet PNG</a> · <a href="separated/${name}/00.png">Primeiro quadro</a></p>`;document.getElementById('grid').append(card);const image=new Image();image.src=`separated/${name}.png`;actors.push({image,w,h,ctx:card.querySelector('canvas').getContext('2d')});}
function draw(){for(const {image,w,h,ctx} of actors){if(!image.complete||!image.naturalWidth)continue;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,w*2,h*2);ctx.drawImage(image,frame*w,0,w,h,0,0,w*2,h*2);}document.getElementById('frame').value=frame;document.getElementById('number').textContent=(frame+1)+' / 24';}
document.getElementById('play').onclick=function(){paused=!paused;this.textContent=paused?'Reproduzir':'Pausar';};document.getElementById('frame').oninput=function(){paused=true;document.getElementById('play').textContent='Reproduzir';frame=Number(this.value);draw();};function tick(now){if(now-last>=100){if(!paused)frame=(frame+1)%24;draw();last=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
