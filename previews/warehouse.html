<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia · Armazém</title><link rel="stylesheet" href="warehouse.css"><script src="warehouse-state.js" defer></script><script src="warehouse.js" defer></script></head>
<body><main>
<header class="preview"><span>PRÉVIA INTERATIVA · recursos fictícios</span><div><label for="warehouse">Armazém</label> <select id="warehouse"><option value="0">Azul</option><option value="1">Vermelho</option></select><button id="death" class="blue">Simular morte</button><button id="reset" class="blue">Reiniciar teste</button></div></header>
<button id="open" class="building" aria-label="Abrir armazém"><img src="../assets/tiny-swords/Buildings/Blue Buildings/House3.png" alt="Armazém"><span class="ribbon">Abrir armazém</span></button>
<dialog id="panel" aria-labelledby="title"><section class="table"><div class="frame" aria-hidden="true"><i class="tl"></i><i class="top"></i><i class="tr"></i><i class="left"></i><i class="right"></i><i class="bl"></i><i class="bottom"></i><i class="br"></i></div>
<button id="close" class="close" aria-label="Fechar armazém"><img src="../assets/tiny-swords/UI Elements/UI Elements/Icons/Icon_09.png" alt=""></button>
<h1 class="ribbon" id="title">Armazém</h1><p class="capacity">20 unidades por espaço</p><div id="slots" class="slots" aria-label="Materiais armazenados"></div>
<section class="parchment" aria-labelledby="material"><h2 id="material"></h2><p id="balance"></p><div class="quantity" role="group" aria-label="Quantidade para transferir"><button id="less" class="blue" aria-label="Diminuir quantidade">−</button><output id="quantity" aria-label="Quantidade" aria-live="polite">1</output><button id="more" class="blue" aria-label="Aumentar quantidade">+</button></div><div class="actions"><button class="blue" data-direction="withdraw">Retirar</button><button class="blue" data-direction="deposit">Guardar</button></div><p id="status" role="status" aria-live="polite">Selecione um material para transferir.</p></section>
<h2 class="inventory-title">Seu inventário <small>sem limite</small></h2><div id="bag" class="bag"></div>
<div class="test-actions"><button id="panel-death" class="blue">Testar morte</button><button id="panel-switch" class="blue">Trocar armazém</button></div>
</section></dialog><p class="note">Esta prévia não altera o jogo nem os recursos salvos.</p></main></body></html>
