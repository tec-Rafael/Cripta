<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia · Mapa de Aventura</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#47aba9;color:#493c2c;font:600 18px Georgia,serif}button{font:inherit;cursor:url('../assets/ui/cursor-02.png') 9 1,pointer}img{image-rendering:pixelated}#tower{border:0;background:none;color:#fff6d8;text-shadow:1px 2px #294b57}#tower img{display:block;width:128px;height:256px;object-fit:contain;margin:auto}dialog{border:0;padding:22px;background:transparent;width:min(780px,98vw);max-height:98dvh;overflow:auto;color:inherit}dialog::backdrop{background:#153c4477;backdrop-filter:blur(3px)}.parchment{position:relative;border:solid transparent;border-width:28px 32px 40px;border-image:url('../assets/ui/home-banner.png') 64 fill /28px 32px 40px/0 stretch;padding:8px 10px 12px;image-rendering:pixelated;min-height:560px}.title{margin:0 auto;position:relative;width:90%;min-height:76px;display:grid;place-items:center;border:solid transparent;border-width:12px 36px 10px;border-image:url('../assets/ui/ribbon-blue.png') 20 96 12 96 fill /12px 36px 10px/0 stretch;color:#fff6d8;text-shadow:2px 2px #294b57;font-size:clamp(20px,4vw,32px);text-align:center}.close{position:absolute;right:-15px;top:-23px;z-index:2;border:0;background:none;padding:4px}.close img{width:46px;height:46px}.close:hover{transform:scale(1.08)}.map{position:relative;height:320px;margin-top:16px;isolation:isolate}.route{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.route path{fill:none;stroke:#8e7952;stroke-width:3;stroke-dasharray:9 13;stroke-linecap:round;opacity:.6}.boss{position:absolute;left:8%;top:38%;width:140px;min-height:150px;display:grid;place-items:center;border:0;background:radial-gradient(ellipse,#76a060a6 0%,#76a06044 56%,transparent 72%);color:#3d4930;transition:transform .18s,filter .18s}.boss img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 5px 0 #45563733)}.boss:hover,.boss:focus-visible{transform:translateY(-5px) scale(1.06);filter:brightness(1.1)}.boss[aria-pressed="true"]{filter:drop-shadow(0 0 6px #5d8e43)}.caption{text-align:center;font-size:15px;line-height:1.5;margin:4px 0;min-height:45px}.preview-note{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#fff6d8;font-size:14px}button:focus-visible{outline:2px solid #346567;outline-offset:4px}@media(max-width:480px){dialog{padding:16px 10px}.parchment{border-width:24px 22px 32px;padding:8px 0;min-height:470px}.title{width:96%;border-left-width:22px;border-right-width:22px}.map{height:260px}.boss{left:1%;width:120px}.boss img{width:108px;height:108px}.close{right:-13px;top:-20px}.close img{width:40px;height:40px}}@media(prefers-reduced-motion:reduce){.boss{transition:none}}
.caption,.preview-note,.boss span{display:none}</style></head><body>
<button id="tower" aria-label="Abrir mapa de aventura"><img src="../assets/tiny-swords/Buildings/Black Buildings/Tower.png" alt="Torre negra">Mapa de Aventura</button>
<dialog id="adventure" aria-labelledby="title"><section class="parchment"><button class="close" aria-label="Cancelar e sair"><img src="../assets/tiny-swords/UI Elements/UI Elements/Icons/Icon_09.png" alt=""></button><h1 class="title" id="title">Mapa de Aventura</h1><div class="map"><svg class="route" viewBox="0 0 600 320" preserveAspectRatio="none" aria-hidden="true"><path d="M 85 230 C 160 230 155 95 260 95 S 445 100 480 45"/></svg><button class="boss" aria-pressed="false" aria-label="Selecionar Urso, primeiro chefe disponível"><img src="../assets/enemies/mbqmms-reference/Badge.png" alt="Emblema do Urso"><span>Urso</span></button></div><p class="caption" id="status" role="status">Derrote o chefe para avançar na aventura.</p></section></dialog>
<div class="preview-note">Prévia visual · sem alterar seu progresso</div>
<script>
const panel=document.querySelector('#adventure'),boss=document.querySelector('.boss'),status=document.querySelector('#status');
function openMap(){boss.setAttribute('aria-pressed','false');status.textContent='Derrote o chefe para avançar na aventura.';panel.showModal();}
document.querySelector('#tower').onclick=openMap;
document.querySelector('.close').onclick=()=>panel.close();
boss.onclick=()=>{boss.setAttribute('aria-pressed','true');status.textContent='Urso selecionado · primeiro chefe da aventura. Na versão final, esta escolha seguirá para a seleção de classe.';};
openMap();
</script></body></html>
